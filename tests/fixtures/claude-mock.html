<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Mock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #1a1a1a; color: #e5e5e5; font-family: sans-serif; }

    nav {
      width: 288px;
      background: #111;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    .group {
      position: relative;
    }

    nav a {
      display: block;
      padding: 6px 10px;
      border-radius: 6px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    nav a:hover { background: #222; }

    .more-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-size: 16px;
      padding: 2px 6px;
      display: none;
    }

    .group:hover .more-btn { display: block; }

    main {
      flex: 1;
      padding: 40px;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 20px;
      background: #222;
      color: #e5e5e5;
      border: 1px solid #444;
      padding: 8px;
    }
  </style>
</head>
<body>
